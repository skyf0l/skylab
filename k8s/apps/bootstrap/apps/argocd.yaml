apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          # Auto updated by parent ApplicationSet
          - list:
              elements:
                - name: skylab
          - git:
              repoURL: https://github.com/skyf0l/skylab.git
              revision: main
              files:
                - path: clusters/{{.name }}/config.json
  template:
    metadata:
      name: "{{.name}}-argocd"
      labels:
        app.kubernetes.io/part-of: bootstrap
        skylab.dev/tier: platform
      annotations:
        argocd.argoproj.io/sync-wave: "4"
    spec:
      project: platform
      source:
        repoURL: "{{.repo.url}}"
        targetRevision: "{{.repo.revision}}"
        path: k8s/projects/bootstrap/argocd
        helm:
          releaseName: argocd
          valueFiles:
            - values.yaml
            - values/{{.name}}.yaml
          parameters:
            - name: "argo-cd.global.domain"
              value: "argocd.{{.global.domain}}"
            - name: "argo-cd.server.ingress.extraTls[0].hosts[0]"
              value: "argocd.{{.global.domain}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - Validate=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
          - RespectIgnoreDifferences=true
          - ServerSideApply=true # Avoids annotation size limits
        retry:
          limit: 10
