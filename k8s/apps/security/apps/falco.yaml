apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: falco
  annotations:
    # After falco-operator (CRDs) and the monitoring stack (ServiceMonitor /
    # PrometheusRule CRDs).
    argocd.argoproj.io/sync-wave: "1"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          # Auto updated by parent ApplicationSet
          - list:
              elements:
                - name: skylab
          - git:
              repoURL: https://github.com/skyf0l/skylab.git
              revision: main
              files:
                - path: clusters/{{.name }}/config.json
  template:
    metadata:
      name: "{{.name}}-falco"
      labels:
        app.kubernetes.io/part-of: security
        skylab.dev/tier: platform
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      project: platform
      source:
        repoURL: "{{.repo.url}}"
        targetRevision: "{{.repo.revision}}"
        path: k8s/projects/security/falco
        helm:
          releaseName: falco
          valueFiles:
            - values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: falco
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - Validate=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
          - RespectIgnoreDifferences=true
          - ServerSideApply=true
        retry:
          limit: 10
