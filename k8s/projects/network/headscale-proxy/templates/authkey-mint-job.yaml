{{- if .Values.authkeyMint.enabled }}
# Mints one REUSABLE user-less Headscale pre-auth key per zone (tagged with the
# zone's tag) into Secret tail-<zone>-authkey. Re-mints only when the stored key
# is missing or gone from Headscale, so keys don't pile up and a pruned key can't
# strand the nodes. PreSync hook (NOT PostSync): the proxy Deployments can't go
# Healthy without these secrets, and PostSync waits for Healthy. SA/RBAC weight 0, Job 1.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headscale-proxy-mint
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
---
# Write the auth-key Secrets in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: headscale-proxy-mint
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: headscale-proxy-mint
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: headscale-proxy-mint
subjects:
  - kind: ServiceAccount
    name: headscale-proxy-mint
---
# Scoped exec into ONLY the Headscale pod: a Role in the headscale namespace
# pinned to the headscale-0 pod.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: headscale-proxy-mint-exec
  namespace: {{ .Values.authkeyMint.headscaleNamespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: [{{ .Values.authkeyMint.headscalePod | quote }}]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    resourceNames: [{{ .Values.authkeyMint.headscalePod | quote }}]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: headscale-proxy-mint-exec
  namespace: {{ .Values.authkeyMint.headscaleNamespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: headscale-proxy-mint-exec
subjects:
  - kind: ServiceAccount
    name: headscale-proxy-mint
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: headscale-proxy-mint
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    spec:
      serviceAccountName: headscale-proxy-mint
      restartPolicy: Never
      containers:
        - name: mint
          image: {{ .Values.authkeyMint.jobImage | quote }}
          command: ["/bin/sh", "-c"]
          env:
            - name: HS_NS
              value: {{ .Values.authkeyMint.headscaleNamespace | quote }}
            - name: HS_POD
              value: {{ .Values.authkeyMint.headscalePod | quote }}
            - name: EXP
              value: {{ .Values.authkeyMint.expiration | quote }}
            - name: ZONES
              value: "{{ range $name, $z := .Values.zones }}{{ $name }}={{ $z.tag }} {{ end }}"
          args:
            - |
              set -eu
              hs() { kubectl -n "$HS_NS" exec "$HS_POD" -c headscale -- headscale "$@"; }
              echo "Waiting for the Headscale CLI..."
              i=0; until hs users list >/dev/null 2>&1; do
                i=$((i+1)); [ "$i" -ge 30 ] && { echo "headscale not responding" >&2; exit 1; }
                sleep 2
              done
              for entry in $ZONES; do
                SECRET="tail-${entry%%=*}-authkey"; TAG="${entry#*=}"
                # `preauthkeys list` masks keys as hskey-auth-<prefix>-***, so match
                # on the stored key's first 20 chars.
                STORED=$(kubectl get secret "$SECRET" -o jsonpath='{.data.authkey}' 2>/dev/null | base64 -d 2>/dev/null || true)
                if [ -n "$STORED" ] && hs preauthkeys list -o json 2>/dev/null | grep -qF "$(printf '%s' "$STORED" | cut -c1-20)"; then
                  echo "$SECRET: key still present in Headscale; skipping."
                  continue
                fi
                # Tags MUST be baked into the key: authkey-registered nodes can't self-request tags.
                KEY=$(hs preauthkeys create --reusable --expiration "$EXP" --tags "$TAG" 2>&1 \
                  | grep -oE '[a-z]+key-[A-Za-z0-9_.-]+|[a-f0-9]{48,}' | head -1)
                [ -n "${KEY:-}" ] || { echo "$SECRET: could not extract pre-auth key" >&2; exit 1; }
                kubectl create secret generic "$SECRET" --from-literal=authkey="$KEY" \
                  --dry-run=client -o yaml | kubectl apply -f -
                echo "$SECRET: minted for $TAG."
              done
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
{{- end }}
