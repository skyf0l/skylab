{{- if .Values.externalSecret.enabled }}
# Pushover credentials for Alertmanager, mounted into its pod by the operator
# (alertmanagerSpec.secrets) and read through user_key_file / token_file.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-pushover
  labels:
    app.kubernetes.io/part-of: kube-prometheus
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecret.storeName }}
    kind: ClusterSecretStore
  target:
    name: alertmanager-pushover
    creationPolicy: Owner
  data:
    - secretKey: user_key
      remoteRef: { key: {{ .Values.externalSecret.vaultKey | quote }}, property: pushover_user_key }
    - secretKey: token
      remoteRef: { key: {{ .Values.externalSecret.vaultKey | quote }}, property: pushover_token }
{{- end }}
