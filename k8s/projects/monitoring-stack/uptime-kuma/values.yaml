# Uptime Kuma — public status page + tailnet-only admin, ONE instance:
#   status.<domain>       public, path-scoped IngressRoute (status page only)
#   status.tail.<domain>  admin dashboard via headscale-proxy (tailnet-only)
# Kuma only serves monitors that sit on a published status page (page API and
# badges alike) and never shows their targets, so probing tailnet-only services
# by cluster-internal address is safe. Groups from the $private overlay
# (extraGroups) stay off the page entirely.

image:
  kuma: louislam/uptime-kuma:2.5.3
  # Sidecar: reconciles monitors/groups from the static files rendered out of
  # `groups` below. Image line 2.x targets Uptime Kuma 2.x. The 2.1 rc carries
  # the fix for duplicate monitors created in a batch (#177) and reconnection
  # after a Kuma restart; drop back to a stable tag once 2.1.0 is out.
  autokuma: ghcr.io/bigboot/autokuma:2.1.0-rc.2
  provisionJob: python:3.13-alpine

# Injected by the ApplicationSet from the cluster's global.domain:
#   global.domain -> bare domain, used by monitor targets via tpl
#   host          -> status.<domain>, the public hostname
global:
  domain: ""
host: ""

ingress:
  enabled: true
  entryPoint: websecure
  clusterIssuer: letsencrypt-prod
  tlsSecretName: uptime-kuma-tls

storage:
  size: 5Gi
  storageClassName: local-path

resources:
  kuma:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {memory: 512Mi}
  autokuma:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}

autokuma:
  # A monitor whose file disappears is deleted (keep = orphan it instead).
  onDelete: delete

# Post-sync job: first-run initialisation + status page reconcile
# (files/provision.py). No login anywhere: the dashboard is tailnet-only.
provision:
  enabled: true
  socketioVersion: 5.16.4
  # How long to wait for AutoKuma to have created every monitor on the page.
  monitorWaitSeconds: 900

# Applied to every monitor unless the entry overrides them.
defaults:
  interval: 60
  retryInterval: 30
  maxRetries: 2

# Public status page. The provisioning job builds the sections:
# overviewSection lists the group monitors, then one section per group with
# its monitors.
statusPage:
  slug: skylab
  title: skylab
  description: |
    Live health of the services exposed by [skylab](https://github.com/skyf0l/skylab), a GitOps-managed
    RKE2 cluster. Public endpoints are probed through their public hostnames; tailnet-only services are
    probed from inside the cluster. Cluster internals are watched by Prometheus and do not appear here.
  footerText: |
    Monitors, groups and this page are declared in the skylab repository and reconciled by AutoKuma.
  theme: auto
  showCertificateExpiry: true
  showPoweredBy: false
  autoRefreshInterval: 60
  overviewSection: Overview

# Monitor groups, one Kuma group monitor each (a group is down when any member
# is).
# Monitor entries use AutoKuma's snake_case schema and are passed through as-is
# (type, url, hostname, port, accepted_statuscodes, ignore_tls, keyword,
# dns_resolve_*, ...); `id` is the stable file/AutoKuma id. Strings may
# reference {{ .Values.global.domain }}.
groups:
  - id: edge
    name: Public endpoints
    description: Internet-facing services, probed through their public hostnames.
    monitors:
      - id: authelia
        name: Authelia (SSO)
        type: http
        url: "https://auth.{{ .Values.global.domain }}/api/health"
      - id: keycloak
        name: Keycloak (OIDC)
        type: http
        url: "https://keycloak.{{ .Values.global.domain }}/realms/skylab/.well-known/openid-configuration"
      - id: mcp
        name: Garmin MCP gateway
        type: http
        url: "https://mcp.{{ .Values.global.domain }}/healthz"
      - id: headscale
        name: Headscale (tailnet control plane)
        type: http
        url: "https://headscale.{{ .Values.global.domain }}/health"

  - id: mail
    name: Mail
    description: Stalwart mail server — public listeners, JMAP discovery and DNS.
    monitors:
      - id: smtp
        name: SMTP (25)
        type: port
        hostname: "mail.{{ .Values.global.domain }}"
        port: 25
      - id: submissions
        name: SMTP submission (465)
        type: port
        hostname: "mail.{{ .Values.global.domain }}"
        port: 465
      - id: submission
        name: SMTP submission (587)
        type: port
        hostname: "mail.{{ .Values.global.domain }}"
        port: 587
      - id: imaps
        name: IMAPS (993)
        type: port
        hostname: "mail.{{ .Values.global.domain }}"
        port: 993
      - id: jmap
        name: JMAP discovery
        type: http
        url: "https://mail.{{ .Values.global.domain }}/.well-known/jmap"
        # Unauthenticated discovery answers 401; it's the reachability that counts.
        accepted_statuscodes: ["200-299", "401"]
      - id: mx
        name: MX record
        type: dns
        hostname: "{{ .Values.global.domain }}"
        dns_resolve_server: 1.1.1.1
        dns_resolve_type: MX
        port: 53

  - id: tailnet
    name: Tailnet services
    description: Web UIs reachable over the tailnet, probed from inside the cluster.
    monitors:
      - id: grafana
        name: Grafana
        type: http
        url: http://kube-prometheus-grafana.monitoring:80/api/health
      - id: argocd
        name: ArgoCD
        type: http
        url: http://argocd-server.argocd:80/healthz
      - id: vault
        name: Vault
        type: http
        # 200 only when initialised AND unsealed; a sealed Vault is a real outage.
        url: http://vault.vault:8200/v1/sys/health?standbyok=true
      - id: hubble
        name: Hubble UI
        type: http
        url: http://hubble-ui.kube-system:80/
      - id: defectdojo
        name: DefectDojo
        type: http
        url: http://defectdojo-django.defectdojo:80/login?next=/
        # Django ALLOWED_HOSTS only knows the tailnet hostname.
        headers: '{"Host": "defectdojo.tail.{{ .Values.global.domain }}"}'
      - id: falcosidekick-ui
        name: Falcosidekick UI
        type: http
        url: http://falco-falcosidekick-ui.falco:2802/

# Same schema as `groups`, private by default (`public: false` -> reconciled
# into Kuma, visible on the tailnet dashboard, never on the status page).
# Populated by the $private overlay; nothing private belongs in this file.
extraGroups: []
