{{- if .Values.ingress.enabled }}
# PUBLIC route, path-scoped ON PURPOSE: only the status-page surface (SPA route,
# its REST API, badges, static assets) is routed. `/socket.io` and `/dashboard`
# are NOT, so the admin UI cannot even attempt a login from the internet — the
# status page is REST-only and never opens the websocket. Admin access is
# tailnet-only through headscale-proxy (status.tail.<domain> -> this Service).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: uptime-kuma-public
  labels:
    app: uptime-kuma
spec:
  entryPoints:
    - {{ .Values.ingress.entryPoint }}
  routes:
    - kind: Rule
      match: >-
        Host(`{{ .Values.host }}`) && (PathPrefix(`/status/`) || PathPrefix(`/api/status-page/`) || PathPrefix(`/api/badge/`)
        || PathPrefix(`/assets/`) || PathPrefix(`/upload/`) || Path(`/icon.svg`) || Path(`/favicon.ico`) || Path(`/manifest.json`)
        || PathRegexp(`^/(apple-touch-icon|icon-[0-9]+x[0-9]+)\.png$`))
      services:
        - name: uptime-kuma
          port: 3001
    # `/` -> the status page. Kuma's own entry-page setting would send `/` to
    # /dashboard for anonymous visitors; the redirect keeps that out of the DB.
    - kind: Rule
      match: Host(`{{ .Values.host }}`) && Path(`/`)
      middlewares:
        - name: uptime-kuma-entry
      services:
        - name: uptime-kuma
          port: 3001
  tls:
    secretName: {{ .Values.ingress.tlsSecretName }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: uptime-kuma-entry
  labels:
    app: uptime-kuma
spec:
  redirectRegex:
    regex: "^https://([^/]+)/$"
    replacement: "https://${1}/status/{{ .Values.statusPage.slug }}"
{{- end }}
