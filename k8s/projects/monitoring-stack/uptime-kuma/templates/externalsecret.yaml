{{- if .Values.externalSecret.enabled }}
# Local admin credential (Kuma has no OIDC). Consumed by the provisioning job
# (creates the account on first run) and by the AutoKuma sidecar (logs in to
# reconcile monitors).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: uptime-kuma-secrets
  labels:
    app: uptime-kuma
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecret.storeName }}
    kind: ClusterSecretStore
  target:
    name: uptime-kuma-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: {{ .Values.admin.username | quote }}
        password: "{{ `{{ .admin_password }}` }}"
  data:
    - secretKey: admin_password
      remoteRef: { key: {{ .Values.externalSecret.vaultKey | quote }}, property: admin_password }
{{- end }}
