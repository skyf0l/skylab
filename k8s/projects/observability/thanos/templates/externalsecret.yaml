{{- if .Values.externalSecret.enabled }}
# R2 S3 credentials for the object store, minted on demand by Vault's cloudflare
# secrets engine (r2-thanos role) — no static key in KV, same model as
# external-dns. ESO templates the leased keypair into a full Thanos objstore.yml
# in the thanos-objstore Secret, mounted by the store-gateway / compactor and
# passed to the kube-prometheus sidecar. All three read it at start: they carry
# a Reloader annotation and roll onto the new keypair while the previous lease
# is still valid. The double-brace blocks below are ESO templates
# (backtick-escaped so Helm passes them through verbatim).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.externalSecret.serviceAccount }}
  labels:
    app.kubernetes.io/part-of: thanos
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: thanos-objstore
  labels:
    app.kubernetes.io/part-of: thanos
spec:
  path: {{ .Values.externalSecret.credsPath | quote }}
  method: GET
  provider:
    server: {{ .Values.externalSecret.vaultServer | quote }}
    auth:
      kubernetes:
        mountPath: {{ .Values.externalSecret.vaultAuthMount | quote }}
        role: {{ .Values.externalSecret.vaultRole | quote }}
        serviceAccountRef:
          name: {{ .Values.externalSecret.serviceAccount }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: thanos-objstore
  labels:
    app.kubernetes.io/part-of: thanos
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  target:
    name: thanos-objstore
    creationPolicy: Owner
    template:
      # NB: no `engine:` field — the external-secrets.io/v1 CRD removed it (v2 is
      # the only/default engine). Leaving it in makes ArgoCD apply fail with
      # ".spec.target.template.engine: field not declared in schema".
      data:
        objstore.yml: |
          type: S3
          config:
            bucket: {{ .Values.objstore.bucket | quote }}
            endpoint: {{ .Values.objstore.endpoint | quote }}
            region: {{ .Values.objstore.region | quote }}
            # R2-friendly: path-style addressing (= Loki's s3ForcePathStyle), and
            # no AWS SDK ambient auth / SigV2.
            bucket_lookup_type: path
            aws_sdk_auth: false
            signature_version2: false
            insecure: false
            # The engine derives an S3 keypair for r2_s3_credentials roles.
            access_key: {{ `"{{ .r2_access_key_id }}"` }}
            secret_key: {{ `"{{ .r2_secret_access_key }}"` }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: thanos-objstore
{{- end }}
