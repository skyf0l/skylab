{{- if .Values.externalSecret.enabled }}
# R2 S3 credentials for Loki's S3 backend, minted on demand by Vault's cloudflare
# secrets engine (r2-loki role) — no static key in KV, same model as external-dns.
# Written into the loki-r2 Secret with env-var-named keys the Loki pod consumes
# via extraEnvFrom + -config.expand-env=true (read at start: Reloader rolls it).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.externalSecret.serviceAccount }}
  labels:
    app: loki
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: loki-r2
  labels:
    app: loki
spec:
  path: {{ .Values.externalSecret.credsPath | quote }}
  method: GET
  provider:
    server: {{ .Values.externalSecret.vaultServer | quote }}
    auth:
      kubernetes:
        mountPath: {{ .Values.externalSecret.vaultAuthMount | quote }}
        role: {{ .Values.externalSecret.vaultRole | quote }}
        serviceAccountRef:
          name: {{ .Values.externalSecret.serviceAccount }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-r2
  labels:
    app: loki
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  target:
    name: loki-r2
    creationPolicy: Owner
    template:
      data:
        # The engine derives an S3 keypair for r2_s3_credentials roles.
        R2_ACCESS_KEY_ID: "{{ `{{ .r2_access_key_id }}` }}"
        R2_SECRET_ACCESS_KEY: "{{ `{{ .r2_secret_access_key }}` }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: loki-r2
{{- end }}
