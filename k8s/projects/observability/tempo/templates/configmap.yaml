# Tempo's whole config. Kept in the wrapper (not generated by an upstream chart)
# so the receiver list is exactly what we accept and nothing more.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/part-of: tempo
data:
  tempo.yaml: |
    multitenancy_enabled: false
    usage_report:
      # No phone-home (matches alloy's enableReporting: false).
      reporting_enabled: false
    # Lets Grafana stream TraceQL search results as they are found instead of
    # blocking until the whole block range has been scanned.
    stream_over_http_enabled: true

    server:
      http_listen_port: 3200
      grpc_listen_port: 9095

    distributor:
      receivers:
        # OTLP only. Everything reaches Tempo through Alloy, which speaks OTLP —
        # the jaeger/zipkin/opencensus receivers would be listeners with no
        # sender.
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

    ingester:
      # How long a block stays open before it is cut and shipped to R2. Also caps
      # how much unflushed data the local PVC ever holds.
      max_block_duration: {{ .Values.maxBlockDuration }}

    compactor:
      compaction:
        block_retention: {{ .Values.retention }}

    # TraceQL metrics (`| rate()`, `| quantile_over_time()`) are computed by the
    # metrics-generator, not by Prometheus — Grafana's Tempo explore page issues
    # one by default, and without a generator in the ring every such panel 500s
    # with "empty ring". Only the local-blocks processor is enabled: it answers
    # those queries from the generator's own blocks. The span-metrics and
    # service-graphs processors are deliberately NOT enabled — those remote-write
    # a per-span-name//per-edge series set into Prometheus, and Thanos block size
    # here scales with distinct series.
    metrics_generator:
      processor:
        local_blocks:
          # Record every span, not just server-kind ones, so rate() over an
          # arbitrary TraceQL selector matches what the trace view shows.
          filter_server_spans: false
      storage:
        path: /var/tempo/generator/wal
      traces_storage:
        path: /var/tempo/generator/traces

    overrides:
      defaults:
        metrics_generator:
          processors: [local-blocks]

    storage:
      trace:
        backend: s3
        s3:
          bucket: {{ .Values.objstore.bucket | quote }}
          endpoint: {{ .Values.objstore.endpoint | quote }}
          region: {{ .Values.objstore.region | quote }}
          # R2-friendly: path-style addressing (= the thanos chart's
          # bucket_lookup_type: path / Loki's s3ForcePathStyle), TLS on.
          forcepathstyle: true
          insecure: false
          # Expanded from the environment at start (-config.expand-env=true) out
          # of the ESO-managed tempo-r2 Secret — never in git.
          access_key: ${R2_ACCESS_KEY_ID}
          secret_key: ${R2_SECRET_ACCESS_KEY}
        wal:
          path: /var/tempo/wal
