{{- if .Values.externalSecret.enabled }}
# R2 S3 credentials for Tempo's trace block storage, minted on demand by Vault's
# cloudflare secrets engine (r2-tempo role) — no static key in KV, same model as
# loki and thanos. Written into the tempo-r2 Secret with env-var-named keys the
# Tempo pod consumes via envFrom + -config.expand-env=true (read at start:
# Reloader rolls it).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.externalSecret.serviceAccount }}
  labels:
    app.kubernetes.io/part-of: tempo
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: tempo-r2
  labels:
    app.kubernetes.io/part-of: tempo
spec:
  path: {{ .Values.externalSecret.credsPath | quote }}
  method: GET
  provider:
    server: {{ .Values.externalSecret.vaultServer | quote }}
    auth:
      kubernetes:
        mountPath: {{ .Values.externalSecret.vaultAuthMount | quote }}
        role: {{ .Values.externalSecret.vaultRole | quote }}
        serviceAccountRef:
          name: {{ .Values.externalSecret.serviceAccount }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tempo-r2
  labels:
    app.kubernetes.io/part-of: tempo
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  target:
    name: tempo-r2
    creationPolicy: Owner
    template:
      data:
        # The engine derives an S3 keypair for r2_s3_credentials roles.
        R2_ACCESS_KEY_ID: "{{ `{{ .r2_access_key_id }}` }}"
        R2_SECRET_ACCESS_KEY: "{{ `{{ .r2_secret_access_key }}` }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: tempo-r2
{{- end }}
