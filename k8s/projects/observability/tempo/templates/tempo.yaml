# Tempo, monolithic: distributor + ingester + querier + compactor in one process.
# Local disk is WAL + not-yet-flushed blocks only; the data of record is in R2.
# RWO PVC -> Recreate strategy. NEVER scale past one replica: the compactor is a
# singleton per bucket.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tempo
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/part-of: tempo
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/part-of: tempo
  annotations:
    # The R2 keypair is expanded into the config at start: roll onto a rotated one.
    secret.reloader.stakater.com/reload: tempo-r2
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tempo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tempo
        app.kubernetes.io/part-of: tempo
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tempo
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -config.file=/conf/tempo.yaml
            # Expand ${R2_*} in the config from env, sourced from the ESO-managed
            # secret below.
            - -config.expand-env=true
          ports:
            - name: http
              containerPort: 3200
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          envFrom:
            - secretRef:
                name: tempo-r2
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 20
          livenessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 30
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/tempo
            - name: config
              mountPath: /conf
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tempo
        - name: config
          configMap:
            name: tempo
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/part-of: tempo
spec:
  selector:
    app.kubernetes.io/name: tempo
  ports:
    - name: http # Grafana's Tempo datasource + /metrics
      port: 3200
      targetPort: http
    - name: otlp-grpc # alloy's trace exporter
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
