# Grafana Tempo — trace storage on Cloudflare R2 (S3-compatible).
#
# Data flow (single-node homelab):
#   alloy (OTLP receiver) -> tempo:4317/4318 -> WAL on a local PVC -> blocks to R2
#   grafana               -> tempo:3200      -> TraceQL search + trace-by-id, over
#                                               both the local WAL and R2
#
# Monolithic mode: one process running distributor + ingester + querier +
# compactor. The compactor MUST stay a singleton — never scale this past one
# replica against one bucket.
#
# Creds: a dedicated R2 keypair (Object R/W on the skylab-tempo bucket) is minted
# by Vault's cloudflare engine and read from the environment at start; the
# non-secret bucket/endpoint live per-cluster in values/<cluster>.yaml.

image:
  repository: grafana/tempo
  tag: 2.10.8
  pullPolicy: IfNotPresent

# R2 object store (S3 API). access_key/secret_key are NOT here — they are expanded
# from the env at start (-config.expand-env=true) out of the ESO-managed tempo-r2
# Secret.
objstore:
  bucket: "" # per-cluster, e.g. skylab-tempo
  endpoint: "" # per-cluster, <accountid>.r2.cloudflarestorage.com (NO https:// scheme)
  region: auto

# Compacted-block retention in R2. Traces are by far the fattest signal per unit
# of activity — a single chatty service outweighs all of Loki. Start short and
# raise it once the bucket's real growth is known (Loki is 30d, Thanos raw 14d).
retention: 168h # 7d

# Local disk holds only the WAL and blocks not yet flushed to R2 (max_block_duration
# below caps how much that can be); the data of record is in R2. RWO volume ->
# Recreate strategy, same as the thanos components.
persistence:
  storageClass: local-path
  size: 5Gi

# How long a block stays open before being cut and shipped to R2. Shorter = less
# data at risk on the local PVC and searchable-in-R2 sooner, at the cost of more,
# smaller objects for the compactor to merge.
maxBlockDuration: 30m

resources:
  requests: {cpu: 50m, memory: 256Mi}
  limits: {memory: 1Gi}

# R2 credentials are an S3 keypair minted by Vault's cloudflare engine (r2-tempo
# role, bucket-scoped) and leased by the ESO generator — same model as loki and
# thanos, no static key in KV. ESO writes it into the tempo-r2 Secret as
# env-var-named keys (R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY) which the config
# expands at start; Reloader restarts Tempo onto the new keypair while the old
# one is still valid. Lease 720h, refreshed at 240h.
externalSecret:
  enabled: true
  serviceAccount: tempo-r2
  vaultServer: "http://vault.vault.svc:8200"
  vaultAuthMount: kubernetes
  vaultRole: tempo-r2
  credsPath: "cloudflare/creds/r2-tempo"
  refreshInterval: 240h

# ServiceMonitor so Prometheus scrapes Tempo's own metrics (picked up by the
# cluster-wide serviceMonitorSelector in the kube-prometheus chart).
serviceMonitor:
  enabled: true
