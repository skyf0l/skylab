{{- if .Values.serviceMonitor.enabled }}
# The operator names each Service after its CR and copies the CR labels onto it.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: falco
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: falco
  endpoints:
    - port: web
      path: /metrics
      interval: 15s
      honorLabels: true
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: falcosidekick
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: falcosidekick
  endpoints:
    - port: http
      path: /metrics
{{- end }}
