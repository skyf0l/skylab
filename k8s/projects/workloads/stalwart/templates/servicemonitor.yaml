# Prometheus scrape of Stalwart's metrics endpoint. The endpoint is enabled by
# the provisioning job with the scrape-only Basic auth below (v0.16 path).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: stalwart
  labels:
    app: stalwart
spec:
  selector:
    matchLabels:
      app: stalwart
  endpoints:
    - port: http
      path: /metrics/prometheus
      interval: 60s
      basicAuth:
        username:
          name: stalwart-secrets
          key: metrics_username
        password:
          name: stalwart-secrets
          key: metrics_password
