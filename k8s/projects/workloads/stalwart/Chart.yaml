apiVersion: v2
name: stalwart
description: >-
  Custom chart deploying upstream Stalwart (mail server) as a single-replica
  StatefulSet with hostPort mail listeners, cert-manager TLS from files, and a
  values-driven provisioning job that reconciles domains/accounts/listeners
  with stalwart-cli apply and publishes DKIM records as external-dns
  DNSEndpoints.
type: application
version: 0.2.0
appVersion: "0.16.19"
