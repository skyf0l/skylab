apiVersion: apps/v1
kind: Deployment
metadata:
  name: skyf0l-dev
  labels:
    app: skyf0l-dev
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: skyf0l-dev
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Single replica: bring the new pod up before the old one goes.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: skyf0l-dev
    spec:
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      containers:
        - name: nginx
          image: {{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources: {{- toYaml .Values.resources | nindent 12 }}
