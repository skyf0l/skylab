# Every secret the upstream chart would otherwise generate at render time, from
# Vault (kvv2/cluster/skylab/apps/harbor, seeded by vault/seed-secrets.sh). One
# Secret, distinct keys, referenced by the chart's existingSecret* values.
# REGISTRY_HTPASSWD is derived here (bcrypt) so only the plaintext lives in Vault.
# The DB credential is NOT here — CNPG owns it via the harbor-pg-app secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor
  labels:
    app.kubernetes.io/part-of: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecret.storeName }}
    kind: ClusterSecretStore
  target:
    name: harbor
    creationPolicy: Owner
    template:
      data:
        HARBOR_ADMIN_PASSWORD: {{ `"{{ .admin_password }}"` }}
        secretKey: {{ `"{{ .secret_key }}"` }}
        secret: {{ `"{{ .core_secret }}"` }}
        CSRF_KEY: {{ `"{{ .csrf_key }}"` }}
        JOBSERVICE_SECRET: {{ `"{{ .jobservice_secret }}"` }}
        REGISTRY_HTTP_SECRET: {{ `"{{ .registry_http_secret }}"` }}
        REGISTRY_PASSWD: {{ `"{{ .registry_password }}"` }}
        REGISTRY_HTPASSWD: {{ `"{{ htpasswd \"harbor_registry_user\" .registry_password \"bcrypt\" }}"` }}
  data:
    {{- range list "admin_password" "secret_key" "core_secret" "csrf_key" "jobservice_secret" "registry_http_secret" "registry_password" }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $.Values.externalSecret.vaultKey | quote }}
        property: {{ . }}
    {{- end }}
{{- if .Values.backup.enabled }}
---
# R2 token for Barman backups (gated). Seed r2_backup_* in the same Vault path.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-pg-backup
  labels:
    app.kubernetes.io/part-of: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecret.storeName }}
    kind: ClusterSecretStore
  target:
    name: harbor-pg-backup
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: {{ .Values.externalSecret.vaultKey | quote }}
        property: r2_backup_access_key_id
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: {{ .Values.externalSecret.vaultKey | quote }}
        property: r2_backup_secret_access_key
{{- end }}
