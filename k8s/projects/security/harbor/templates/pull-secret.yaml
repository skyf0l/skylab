{{- if .Values.pullSecret.enabled }}
# Projects are private: node pulls authenticate as the system-level, pull-only
# robot$pull (created in Harbor, secret stored next to the admin password in
# Vault). ESO renders it as a dockerconfigjson Secret in every namespace listed
# in pullSecret.namespaces; charts reference it via imagePullSecrets. Registry
# key = the public host, the one containerd pulls from.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: {{ .Values.pullSecret.name }}
  labels:
    app.kubernetes.io/part-of: harbor
spec:
  externalSecretName: {{ .Values.pullSecret.name }}
  namespaces: {{- toYaml .Values.pullSecret.namespaces | nindent 4 }}
  refreshTime: 1h
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      name: {{ .Values.externalSecret.storeName }}
      kind: ClusterSecretStore
    target:
      name: {{ .Values.pullSecret.name }}
      creationPolicy: Owner
      template:
        type: kubernetes.io/dockerconfigjson
        data:
          .dockerconfigjson: |
            {"auths":{{ `{"` }}{{ .Values.host }}{{ `":{"username":"{{ .pull_robot_name }}","password":"{{ .pull_robot_secret }}","auth":"{{ printf "%s:%s" .pull_robot_name .pull_robot_secret | b64enc }}"}}}` }}
    data:
      - secretKey: pull_robot_name
        remoteRef:
          key: {{ .Values.externalSecret.vaultKey | quote }}
          property: pull_robot_name
      - secretKey: pull_robot_secret
        remoteRef:
          key: {{ .Values.externalSecret.vaultKey | quote }}
          property: pull_robot_secret
{{- end }}
