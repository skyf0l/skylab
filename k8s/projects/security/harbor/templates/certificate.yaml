{{- if .Values.ingress.enabled }}
# Explicit CR: the public route is an IngressRoute (path-scoped), which the
# cert-manager ingress-shim does not handle.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor
  labels:
    app.kubernetes.io/part-of: harbor
spec:
  secretName: {{ .Values.ingress.tlsSecretName }}
  issuerRef:
    name: {{ .Values.ingress.clusterIssuer }}
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.host | quote }}
{{- end }}
---
# Keypair core uses to sign registry bearer tokens (never served to clients).
# The chart would generate a fresh self-signed one on every render; a
# namespaced self-signed Issuer keeps it stable across syncs.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: harbor-selfsigned
  labels:
    app.kubernetes.io/part-of: harbor
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor-token
  labels:
    app.kubernetes.io/part-of: harbor
spec:
  secretName: harbor-token
  issuerRef:
    name: harbor-selfsigned
    kind: Issuer
  commonName: harbor-token
  duration: 87600h
  privateKey:
    algorithm: RSA
    size: 4096
---
# In-cluster https for the `harbor` Service (nginx on 443): a namespace-local CA
# signed by the self-signed Issuer, then a CA Issuer for the serving cert. The
# CA outlives many leaf renewals, so Vault's harbor/config ca_cert (the CA, read
# from harbor-internal-tls ca.crt) stays valid until the CA itself is re-issued.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor-internal-ca
  labels:
    app.kubernetes.io/part-of: harbor
spec:
  secretName: harbor-internal-ca
  issuerRef:
    name: harbor-selfsigned
    kind: Issuer
  isCA: true
  commonName: harbor-internal-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: harbor-internal-ca
  labels:
    app.kubernetes.io/part-of: harbor
spec:
  ca:
    secretName: harbor-internal-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor-internal-tls
  labels:
    app.kubernetes.io/part-of: harbor
spec:
  secretName: harbor-internal-tls
  issuerRef:
    name: harbor-internal-ca
    kind: Issuer
  dnsNames:
    - harbor
    - harbor.{{ .Release.Namespace }}
    - harbor.{{ .Release.Namespace }}.svc
    - harbor.{{ .Release.Namespace }}.svc.cluster.local
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
