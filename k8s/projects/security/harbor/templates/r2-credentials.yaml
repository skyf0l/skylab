{{- if .Values.objstore.enabled }}
# R2 S3 credentials for the registry's blob storage, minted on demand by Vault's
# cloudflare secrets engine (r2-harbor role) — no static key in KV, same model
# as external-dns and the stalwart backups. The registry reads the keypair from
# its environment at start, so the Deployment carries a Reloader annotation
# (values: harbor.registry.podAnnotations) and rolls onto the new token while
# the previous lease is still valid.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.objstore.serviceAccount }}
  labels:
    app.kubernetes.io/part-of: harbor
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: harbor-s3
  labels:
    app.kubernetes.io/part-of: harbor
spec:
  path: {{ .Values.objstore.credsPath | quote }}
  method: GET
  provider:
    server: {{ .Values.objstore.vaultServer | quote }}
    auth:
      kubernetes:
        mountPath: {{ .Values.objstore.vaultAuthMount | quote }}
        role: {{ .Values.objstore.vaultRole | quote }}
        serviceAccountRef:
          name: {{ .Values.objstore.serviceAccount }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-s3
  labels:
    app.kubernetes.io/part-of: harbor
spec:
  refreshInterval: {{ .Values.objstore.refreshInterval }}
  target:
    name: harbor-s3
    creationPolicy: Owner
    template:
      data:
        # The engine derives an S3 keypair for r2_s3_credentials roles; injected
        # with envFrom, so the keys ARE the distribution env vars.
        REGISTRY_STORAGE_S3_ACCESSKEY: "{{ `{{ .r2_access_key_id }}` }}"
        REGISTRY_STORAGE_S3_SECRETKEY: "{{ `{{ .r2_secret_access_key }}` }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: harbor-s3
{{- end }}
