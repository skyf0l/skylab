{{- if .Values.ingress.enabled }}
# PUBLIC route, path-scoped ON PURPOSE: only the OCI surface (/v2/) and the
# token endpoint it redirects to are routed. The portal, /api/ and /c/ (login,
# OIDC) are NOT — the UI cannot even be reached from the internet. Admin
# access is tailnet-only through headscale-proxy (harbor.tail.<domain>).
# Uploads stream through Traefik unbuffered; the chart's nginx sets
# client_max_body_size 0, so layer size is not capped anywhere on the path.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: harbor-public
  labels:
    app.kubernetes.io/part-of: harbor
spec:
  entryPoints:
    - {{ .Values.ingress.entryPoint }}
  routes:
    - kind: Rule
      match: Host(`{{ .Values.host }}`) && (PathPrefix(`/v2/`) || Path(`/service/token`))
      services:
        # 443, not 80: with expose.tls on, nginx answers port 80 with a 301 to
        # https://<same host>, which loops back through this route.
        - name: harbor
          port: 443
          scheme: https
          serversTransport: harbor-internal
  tls:
    secretName: {{ .Values.ingress.tlsSecretName }}
{{- end }}
---
# Traefik -> nginx over https, verified against the namespace-local CA
# (certificate.yaml). Traefik dials the pod IP, so the name is pinned. A route
# in another namespace (headscale-proxy) references this by its bare name: a
# ServersTransport is resolved in the target Service's namespace.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: harbor-internal
  labels:
    app.kubernetes.io/part-of: harbor
spec:
  serverName: harbor.{{ .Release.Namespace }}.svc
  rootCAs:
    - secret: harbor-internal-ca
