{{- if .Values.provision.enabled }}
# Desired mail state as a stalwart-cli plan (rendered from the chart values,
# public + private overlay) plus the DKIM publish script. Not a hook: the Job
# mounts it, and hooks re-render anyway.
apiVersion: v1
kind: ConfigMap
metadata:
  name: stalwart-provision
  labels:
    app: stalwart
data:
  plan.ndjson: |
    {{- include "stalwart.plan" . | nindent 4 }}
  domains.txt: |
    {{- range include "stalwart.domains" . | fromJsonArray }}
    {{ .name }}
    {{- end }}
  dkim.sh: |
{{ .Files.Get "files/dkim.sh" | indent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stalwart-provision
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stalwart-provision
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
rules:
  # Only the DKIM DNSEndpoints — everything else goes through the mail API.
  - apiGroups: ["externaldns.k8s.io"]
    resources: ["dnsendpoints"]
    verbs: ["get", "list", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stalwart-provision
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: stalwart-provision
subjects:
  - kind: ServiceAccount
    name: stalwart-provision
---
# Reconciles the server to the rendered plan on every sync (stalwart-cli apply,
# idempotent upserts) and then publishes the DKIM records. before-hook-creation
# keeps a failed run from wedging the next sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: stalwart-provision
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 900
  template:
    spec:
      serviceAccountName: stalwart-provision
      restartPolicy: Never
      initContainers:
        # The CLI image is distroless (no shell), so the readiness wait lives
        # in its own container.
        - name: wait
          image: {{ .Values.provision.jobImage | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              i=0
              until curl -sf "$STALWART_URL/healthz/ready" >/dev/null; do
                i=$((i+1)); [ "$i" -ge 60 ] && { echo "stalwart not ready" >&2; exit 1; }
                sleep 5
              done
          env:
            - name: STALWART_URL
              value: "http://stalwart:8080"
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
        - name: apply
          image: {{ .Values.provision.cliImage | quote }}
          args: ["apply", "--file", "/etc/provision/plan.ndjson", "--json"]
          env:
            - name: STALWART_URL
              value: "http://stalwart:8080"
            - name: STALWART_USER
              value: {{ .Values.provision.adminUser | quote }}
            - name: STALWART_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stalwart-secrets
                  key: admin_password
            - name: NO_COLOR
              value: "1"
          volumeMounts:
            - name: provision
              mountPath: /etc/provision
              readOnly: true
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
      containers:
        - name: dkim
          image: {{ .Values.provision.jobImage | quote }}
          command: ["/bin/sh", "/etc/provision/dkim.sh"]
          env:
            - name: STALWART_URL
              value: "http://stalwart:8080"
            - name: STALWART_ADMIN_USER
              value: {{ .Values.provision.adminUser | quote }}
            - name: STALWART_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stalwart-secrets
                  key: admin_password
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: provision
              mountPath: /etc/provision
              readOnly: true
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: provision
          configMap:
            name: stalwart-provision
{{- end }}
